services:
  stolmal-format-fe:
    container_name: stolmal-format-fe
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /app/node_modules
      - ../storage:/app/public/assets/products:ro
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_HOST=${WDS_SOCKET_HOST:-127.0.0.1}
      - WATCHPACK_POLLING=true

  stolmal-format-fe-nginx:
    container_name: stolmal-format-fe-nginx
    restart: unless-stopped
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - stolmal-format-fe
